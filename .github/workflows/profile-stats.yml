name: Refresh profile stats

on:
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update contribution cards
        run: python3 scripts/update_stats.py --user yedmahos
      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/activity.svg assets/commits.svg assets/contributions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh profile contribution cards'
          git push
